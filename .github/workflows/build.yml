name: Build and validate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install platformio==6.1.19
      - run: pio run -d firmware -e nologo_esp32c3_super_mini
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0' 'ndk;25.1.8937393'
      - run: sh gradlew :app:assembleDebug --console=plain
        working-directory: android
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r server/backend/requirements.txt
      - run: python scripts/check_backend.py
      - run: python server/scripts/init_config.py
      - run: docker compose config --quiet
        working-directory: server
      - run: docker compose up -d --build
        working-directory: server
      - name: Check live API through Nginx
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8081/health; then exit 0; fi
            sleep 3
          done
          docker compose logs backend nginx
          exit 1
        working-directory: server
      - if: always()
        run: docker compose down
        working-directory: server

events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    client_max_body_size 10M;
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
    upstream gps_backend { server backend:8000; }
    server {
        listen 8081;
        server_name _;
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://gps_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /api/auth/ {
            limit_req zone=auth burst=3 nodelay;
            limit_req_status 429;
            proxy_pass http://gps_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /docs { proxy_pass http://gps_backend; }
        location /openapi.json { proxy_pass http://gps_backend; }
        location /health { proxy_pass http://gps_backend/health; }
    }
}

; ════════════════════════════════════════════════════════════════
; GPS Tracker Pro - PlatformIO Configuration
; ════════════════════════════════════════════════════════════════

[platformio]
default_envs = nologo_esp32c3_super_mini
boards_dir = boards

; ────────────────────────────────────────────────────────────────
; ESP32-C3 Super Mini
; ────────────────────────────────────────────────────────────────
[env:nologo_esp32c3_super_mini]
platform = espressif32 @ 6.10.0
board = nologo_esp32c3_super_mini
framework = arduino

; Serial Monitor
monitor_speed = 115200
monitor_filters =
    esp32_exception_decoder
    colorize

; Upload
upload_speed = 921600

; Build Options
build_flags =
    -I include
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DSIM800_DEBUG=1
    -D CONFIG_ARDUHAL_LOG_COLORS=1

; OTA Partition Table (dual OTA slots)
board_build.partitions = partitions_ota.csv

; Filesystem
board_build.filesystem = littlefs

; Libraries
lib_deps =
    bblanchon/ArduinoJson @ 6.21.6
    mikalhart/TinyGPSPlus @ 1.1.0
    knolleary/PubSubClient @ 2.8.0

; Custom libraries
lib_extra_dirs =
    lib

; Ignore warnings
build_unflags =
    -Werror=all
